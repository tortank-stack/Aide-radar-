name: AideRadar V4 - synchronisation et tests

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mettre à jour les fiches connues
        run: python tools/sync_aides.py --html index.html
      - name: Contrôles bloquants
        run: |
          python tools/quality_check.py index.html
          node tools/regression_test.js index.html
      - name: Publier uniquement si les contrôles passent
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "AideRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "chore: synchronise les aides publiques"
          git push
