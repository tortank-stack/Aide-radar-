name: Update AideRadar data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, validate and rebuild aides.json
        run: python update_aides.py

      - name: Validate JSON structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("aides_v15.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          aides = data.get("aides", []) if isinstance(data, dict) else data
          assert isinstance(aides, list), "La base aides n'est pas une liste"
          assert len(aides) >= 1500, f"Base trop petite : {len(aides)} aides"

          if isinstance(data, dict) and "count" in data:
              assert data["count"] == len(aides), "Le compteur de la base est incohérent"

          print(f"JSON valide : {len(aides)} aides")
          PY

      - name: Run AideRadar regression tests
        run: python regression_test.py

      - name: Commit only when data changed
        run: |
          if git diff --quiet -- aides_v15.json; then
            echo "Aucune modification de la base"
            exit 0
          fi

          git config user.name "AideRadar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add aides_v15.json
          git commit -m "chore: update AideRadar aids database"
          git push
