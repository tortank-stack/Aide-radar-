name: Update AideRadar data

on:
  workflow_dispatch:
  schedule:
    # Tous les jours vers 05:17 UTC. GitHub peut décaler légèrement les tâches planifiées.
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: aideradar-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download, validate and rebuild aides.json
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import html
          import io
          import json
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          BASE = "https://data.aides-entreprises.fr/files/"
          URLS = {
              "aides": BASE + "aides.csv",
              "projets": BASE + "projets.csv",
              "profils": BASE + "profils.csv",
              "territoires": BASE + "territoires.csv",
              "groupements": BASE + "groupement_territoire.csv",
          }

          OUT = Path("aides.json")
          TMP = Path("aides.json.tmp")
          TODAY = dt.date.today()

          REQUIRED_AIDES_COLUMNS = {
              "id_aid", "aid_nom", "aid_objet", "aid_operations_el",
              "aid_conditions", "aid_montant", "aid_benef", "aid_validation",
              "couverture_geo", "date_fin", "status", "effectif",
              "projets", "profils", "territoires",
              "complements_sources", "complements_formulaires",
              "complements_reglements"
          }

          def download_csv(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "AideRadar-data-updater/1.0"}
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read()

              if len(raw) < 100:
                  raise RuntimeError(f"Source anormalement petite: {url}")

              # Les CSV officiels sont actuellement encodés en Windows-1252.
              # On garde un fallback pour éviter une panne si l'encodage évolue.
              for enc in ("cp1252", "utf-8-sig", "utf-8"):
                  try:
                      text = raw.decode(enc)
                      break
                  except UnicodeDecodeError:
                      continue
              else:
                  raise RuntimeError(f"Encodage CSV non reconnu: {url}")

              reader = csv.DictReader(io.StringIO(text), delimiter=";")
              rows = list(reader)
              return rows, set(reader.fieldnames or [])

          def normalize(s):
              s = (s or "").lower().replace("’", "'")
              s = unicodedata.normalize("NFD", s)
              s = "".join(c for c in s if unicodedata.category(c) != "Mn")
              return re.sub(r"\s+", " ", s).strip()

          def clean_html(s):
              s = s or ""
              s = re.sub(r"<br\s*/?>", "\n", s, flags=re.I)
              s = re.sub(r"</p\s*>", "\n", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              s = html.unescape(s).replace("\xa0", " ")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n\s+", "\n", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

          def split_ids(s):
              return [x.strip() for x in (s or "").split(",") if x.strip()]

          def first_url(*chunks):
              for chunk in chunks:
                  urls = re.findall(r"https?://[^\s<>\"']+", chunk or "")
                  urls = [u.rstrip(".,);]") for u in urls]
                  for u in urls:
                      if "aides-entreprises.fr" not in u:
                          return u
                  if urls:
                      return urls[0]
              return ""

          def parse_date(value):
              value = (value or "").strip()
              if not value or value.startswith("0000"):
                  return None
              try:
                  return dt.date.fromisoformat(value[:10])
              except ValueError:
                  return None

          print("Téléchargement des sources officielles…")
          aids_rows, aids_cols = download_csv(URLS["aides"])
          project_rows, _ = download_csv(URLS["projets"])
          profile_rows, _ = download_csv(URLS["profils"])
          territory_rows, _ = download_csv(URLS["territoires"])
          grouping_rows, _ = download_csv(URLS["groupements"])

          missing = REQUIRED_AIDES_COLUMNS - aids_cols
          if missing:
              raise RuntimeError(
                  "Le schéma officiel a changé. Colonnes manquantes: "
                  + ", ".join(sorted(missing))
              )

          if len(aids_rows) < 1800:
              raise RuntimeError(
                  f"Seulement {len(aids_rows)} lignes reçues: mise à jour refusée."
              )

          projects = {
              r.get("id_proj", "").strip(): clean_html(r.get("proj_libelle"))
              for r in project_rows if r.get("id_proj")
          }
          profiles = {
              r.get("id_tut", "").strip(): clean_html(r.get("tut_libelle"))
              for r in profile_rows if r.get("id_tut")
          }

          territories = {
              r.get("id_ter", "").strip(): r
              for r in territory_rows if r.get("id_ter")
          }
          departments = [
              r for r in territory_rows
              if r.get("ter_fk_type") == "3" and r.get("ter_code")
          ]

          def department_ancestor(row):
              if not row:
                  return None
              if row.get("ter_fk_type") == "3" and row.get("ter_code"):
                  return row["ter_code"].strip()

              for parent_id in [
                  x for x in (row.get("parents") or "").split(",") if x
              ]:
                  parent = territories.get(parent_id)
                  if (
                      parent
                      and parent.get("ter_fk_type") == "3"
                      and parent.get("ter_code")
                  ):
                      return parent["ter_code"].strip()
              return None

          # Groupement territorial -> départements.
          # On le calcule une seule fois pour éviter les recherches coûteuses
          # lors du traitement de chaque aide.
          grouping_to_deps = {}
          for row in territory_rows:
              dep = department_ancestor(row)
              if not dep:
                  continue

              ids = set()
              for field in ("codes_gte", "groupement_territoire"):
                  ids.update(
                      x.strip()
                      for x in (row.get(field) or "").split(",")
                      if x.strip()
                  )

              for gid in ids:
                  grouping_to_deps.setdefault(gid, set()).add(dep)

          grouping_label_to_id = {
              normalize(r.get("gte_libelle")): r.get("id_gte", "").strip()
              for r in grouping_rows
              if r.get("gte_libelle") and r.get("id_gte")
          }
          grouping_labels = sorted(
              grouping_label_to_id.keys(), key=len, reverse=True
          )

          def numeric_territory_to_deps(tid):
              if tid == "1":
                  return {"ALL"}

              row = territories.get(tid)
              dep = department_ancestor(row)
              if dep:
                  return {dep}

              # Certains anciens identifiants de région ne sont plus des
              # lignes autonomes mais restent présents dans la chaîne parents.
              needle = f",{tid},"
              return {
                  r["ter_code"].strip()
                  for r in departments
                  if needle in (r.get("parents") or "")
              }

          def territory_to_deps(raw, coverage):
              raw = (raw or "").strip()

              if normalize(coverage) == "aide nationale":
                  return {"ALL"}

              deps = set()

              # Régions/départements historiques stockés comme identifiants.
              if raw and re.fullmatch(r"[\d,\s]+", raw):
                  for tid in split_ids(raw):
                      deps.update(numeric_territory_to_deps(tid))
                  return deps

              # EPCI et autres groupements stockés sous forme de libellés.
              nraw = normalize(raw)
              if nraw:
                  for label in grouping_labels:
                      if len(label) >= 5 and label in nraw:
                          gid = grouping_label_to_id[label]
                          deps.update(grouping_to_deps.get(gid, set()))

              return deps

          # L'ancienne base sert uniquement de secours géographique pour les
          # quelques dispositifs dont la source ne fournit pas un territoire
          # exploitable. On ne reprend jamais ses autres champs.
          previous_by_id = {}
          previous_count = None
          if OUT.exists():
              try:
                  previous = json.loads(OUT.read_text(encoding="utf-8"))
                  previous_aids = previous.get("aides", [])
                  previous_count = len(previous_aids)
                  previous_by_id = {
                      str(a.get("id")): a for a in previous_aids if a.get("id")
                  }
              except Exception:
                  previous_by_id = {}

          result = []
          source_dates = []

          for row in aids_rows:
              if (row.get("status") or "").strip() != "1":
                  continue

              end_date = parse_date(row.get("date_fin"))
              if end_date and end_date < TODAY:
                  continue

              aid_id = (row.get("id_aid") or "").strip()
              name = clean_html(row.get("aid_nom"))
              if not aid_id or not name:
                  continue

              deps = territory_to_deps(
                  row.get("territoires"),
                  row.get("couverture_geo")
              )

              if not deps:
                  old = previous_by_id.get(aid_id, {})
                  deps = set(old.get("deps") or [])

              validation_date = parse_date(row.get("aid_validation"))
              if validation_date:
                  source_dates.append(validation_date)

              source = first_url(
                  row.get("complements_sources"),
                  row.get("complements_formulaires"),
                  row.get("complements_reglements"),
              )

              result.append({
                  "id": aid_id,
                  "nom": name,
                  "objet": clean_html(row.get("aid_objet")),
                  "operations": clean_html(row.get("aid_operations_el")),
                  "conditions": clean_html(row.get("aid_conditions")),
                  "montant": clean_html(row.get("aid_montant")),
                  "benef": clean_html(row.get("aid_benef")),
                  "geo": clean_html(row.get("couverture_geo")),
                  "fin": end_date.isoformat() if end_date else "",
                  "projets": [
                      projects[i] for i in split_ids(row.get("projets"))
                      if i in projects
                  ],
                  "profils": [
                      profiles[i] for i in split_ids(row.get("profils"))
                      if i in profiles
                  ],
                  "effectif": clean_html(row.get("effectif")),
                  "deps": sorted(deps),
                  "local": normalize(row.get("couverture_geo"))
                           == "aide territoriale",
                  "source": source,
              })

          # Déduplication stricte par identifiant.
          dedup = {}
          for aid in result:
              dedup[aid["id"]] = aid
          result = list(dedup.values())
          result.sort(
              key=lambda a: (
                  int(a["id"]) if a["id"].isdigit() else 10**12,
                  a["id"]
              )
          )

          # Garde-fous : ne jamais écraser une base saine par une source cassée.
          count = len(result)
          if count < 1800 or count > 5000:
              raise RuntimeError(
                  f"Nombre d'aides anormal ({count}): mise à jour refusée."
              )

          if previous_count:
              ratio = count / previous_count
              if ratio < 0.80 or ratio > 1.20:
                  raise RuntimeError(
                      f"Variation anormale du volume: {previous_count} -> {count}. "
                      "La base existante est conservée."
                  )

          named_ratio = sum(bool(a["nom"]) for a in result) / count
          if named_ratio < 0.99:
              raise RuntimeError("Trop d'aides sans intitulé.")

          national_or_mapped = sum(
              bool(a["deps"]) for a in result
          ) / count
          if national_or_mapped < 0.85:
              raise RuntimeError(
                  "Trop de territoires non résolus: mise à jour refusée."
              )

          updated = (
              max(source_dates).isoformat()
              if source_dates
              else TODAY.isoformat()
          )

          payload = {
              "updated": updated,
              "count": count,
              "source": "Aides entreprises - DGE / ISM",
              "source_url": "https://data.aides-entreprises.fr/",
              "generated_at": dt.datetime.now(dt.timezone.utc)
                  .replace(microsecond=0).isoformat(),
              "aides": result,
          }

          # generated_at ne doit pas provoquer un commit tous les jours si
          # aucune donnée métier n'a changé.
          comparable_new = dict(payload)
          comparable_new.pop("generated_at", None)

          if OUT.exists():
              try:
                  comparable_old = json.loads(OUT.read_text(encoding="utf-8"))
                  comparable_old.pop("generated_at", None)
                  if comparable_old == comparable_new:
                      print(f"Aucun changement ({count} aides).")
                      sys.exit(0)
              except Exception:
                  pass

          TMP.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          # Validation finale du fichier sérialisé avant remplacement.
          check = json.loads(TMP.read_text(encoding="utf-8"))
          if len(check.get("aides", [])) != count:
              raise RuntimeError("Validation JSON finale échouée.")

          TMP.replace(OUT)
          print(
              f"✅ aides.json reconstruit: {count} aides actives, "
              f"données datées du {updated}."
          )
          PY

      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet -- aides.json; then
            echo "Aucune modification à publier."
            exit 0
          fi

          git config user.name "AideRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aides.json
          git commit -m "data: mise à jour automatique des aides"
          git push
